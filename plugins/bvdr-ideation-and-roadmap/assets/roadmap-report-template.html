<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap Report</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Light theme */
  --bg: #FFFFFF;
  --bg-secondary: #F9FAFB;
  --bg-tertiary: #F3F4F6;
  --bg-card: #FFFFFF;
  --bg-hover: #F3F4F6;
  --bg-input: #FFFFFF;
  --border: #E5E7EB;
  --border-light: #F3F4F6;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  /* Priority colors */
  --must: #EF4444;
  --must-bg: #FEF2F2;
  --should: #F59E0B;
  --should-bg: #FFFBEB;
  --could: #3B82F6;
  --could-bg: #EFF6FF;
  --wont: #9CA3AF;
  --wont-bg: #F9FAFB;
  /* Source colors */
  --src-ideation: #8B5CF6;
  --src-ideation-bg: #F5F3FF;
  --src-competitive: #3B82F6;
  --src-competitive-bg: #EFF6FF;
  --src-blindspot: #F97316;
  --src-blindspot-bg: #FFF7ED;
  --src-momentum: #10B981;
  --src-momentum-bg: #ECFDF5;
  --src-open-issue: #14B8A6;
  --src-open-issue-bg: #F0FDFA;
  /* Status colors */
  --status-pending: #F59E0B;
  --status-pending-bg: #FFFBEB;
  --status-accepted: #10B981;
  --status-accepted-bg: #ECFDF5;
  --status-dismissed: #EF4444;
  --status-dismissed-bg: #FEF2F2;
  --status-created: #3B82F6;
  --status-created-bg: #EFF6FF;
  /* Phase status */
  --phase-planned: #3B82F6;
  --phase-active: #10B981;
  --phase-completed: #6B7280;
  /* Accent */
  --accent: #6366F1;
  --accent-light: #EEF2FF;
}

[data-theme="dark"] {
  --bg: #0F1117;
  --bg-secondary: #1A1D2E;
  --bg-tertiary: #252838;
  --bg-card: #1A1D2E;
  --bg-hover: #252838;
  --bg-input: #252838;
  --border: #2D3148;
  --border-light: #252838;
  --text-primary: #F1F5F9;
  --text-secondary: #94A3B8;
  --text-tertiary: #64748B;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -4px rgba(0,0,0,0.3);
  --must-bg: #451A1A;
  --should-bg: #45381A;
  --could-bg: #1A2745;
  --wont-bg: #252838;
  --src-ideation-bg: #2D1B5E;
  --src-competitive-bg: #1A2745;
  --src-blindspot-bg: #452A1A;
  --src-momentum-bg: #1A3A2A;
  --src-open-issue-bg: #1A3A38;
  --status-pending-bg: #45381A;
  --status-accepted-bg: #1A3A2A;
  --status-dismissed-bg: #451A1A;
  --status-created-bg: #1A2745;
  --accent-light: #1E1B4B;
}

html { font-size: 15px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.2s, color 0.2s;
}

/* ── Layout ───────────────────────────────────────────────────── */
.container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

/* ── Header / Vision Banner ───────────────────────────────────── */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 32px 0 28px;
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  flex-wrap: wrap;
}
.header-left { flex: 1; min-width: 300px; }
.project-name {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin-bottom: 6px;
}
.vision-text {
  font-size: 1.05rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
}
.header-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.badge-accent { background: var(--accent-light); color: var(--accent); }
.badge-muted { background: var(--bg-tertiary); color: var(--text-secondary); }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* Theme toggle */
.theme-toggle {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 7px 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 1rem;
  display: flex;
  align-items: center;
  transition: all 0.15s;
}
.theme-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
.theme-toggle .icon-sun, .theme-toggle .icon-moon { width: 18px; height: 18px; }
[data-theme="light"] .theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: none; }

/* Sync to Claude button — only shown when there are unsaved status changes */
.sync-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid #d97706;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 1px 3px rgba(217,119,6,0.3);
}
.sync-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(217,119,6,0.4);
}
.sync-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.sync-btn .sync-badge {
  background: rgba(255,255,255,0.3);
  border-radius: 999px;
  padding: 0 6px;
  font-size: 0.7rem;
  min-width: 18px;
  text-align: center;
}

/* ── Phase Timeline ───────────────────────────────────────────── */
.timeline-section { padding: 28px 0 20px; border-bottom: 1px solid var(--border); }
.section-title {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}
.timeline {
  display: flex;
  gap: 0;
  overflow-x: auto;
  padding-bottom: 8px;
  position: relative;
}
.timeline::before {
  content: '';
  position: absolute;
  top: 20px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--border);
  z-index: 0;
}
.timeline-phase {
  flex: 1;
  min-width: 160px;
  position: relative;
  z-index: 1;
  padding: 0 12px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.timeline-phase:hover { opacity: 0.85; }
.timeline-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--border);
  border: 3px solid var(--bg-secondary);
  margin: 0 auto 12px;
  position: relative;
  transition: all 0.2s;
}
.timeline-phase[data-status="active"] .timeline-dot,
.timeline-phase[data-status="in_progress"] .timeline-dot {
  background: var(--phase-active);
  box-shadow: 0 0 0 4px rgba(16,185,129,0.2);
}
.timeline-phase[data-status="planned"] .timeline-dot { background: var(--phase-planned); }
.timeline-phase[data-status="completed"] .timeline-dot { background: var(--phase-completed); }
.timeline-phase-name {
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
  margin-bottom: 4px;
  color: var(--text-primary);
}
.timeline-phase-count {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  text-align: center;
  margin-bottom: 6px;
}
.moscow-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  flex-wrap: wrap;
}
.moscow-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.moscow-dot[data-priority="must"] { background: var(--must); }
.moscow-dot[data-priority="should"] { background: var(--should); }
.moscow-dot[data-priority="could"] { background: var(--could); }
.moscow-dot[data-priority="wont"] { background: var(--wont); }

/* ── Filters ──────────────────────────────────────────────────── */
.filters-section { padding: 20px 0 16px; border-bottom: 1px solid var(--border); }
.filters-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--bg-tertiary);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
}
.filter-btn {
  padding: 6px 12px;
  font-size: 0.75rem;
  font-weight: 500;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.filter-btn.active { background: var(--accent); color: #fff; }
.filter-btn + .filter-btn { border-left: 1px solid var(--border); }

/* MoSCoW priority pills in filter bar — clickable quick filters (same pattern as ideation type badges) */
.priority-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.priority-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, box-shadow 0.2s, transform 0.15s;
  user-select: none;
}
.priority-pill:hover {
  opacity: 0.85;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.priority-pill.active {
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor;
  transform: translateY(-1px);
}
.priority-pill.dimmed {
  opacity: 0.35;
}
.priority-pill .pill-count {
  background: rgba(255,255,255,0.3);
  border-radius: 999px;
  padding: 0 5px;
  font-size: 0.65rem;
  min-width: 18px;
  text-align: center;
}
.priority-pill[data-priority="must"] { background: var(--must); color: #fff; }
.priority-pill[data-priority="should"] { background: var(--should); color: #fff; }
.priority-pill[data-priority="could"] { background: var(--could); color: #fff; }
.priority-pill[data-priority="wont"] { background: var(--wont); color: #fff; }

.search-input {
  padding: 7px 12px;
  font-size: 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-input);
  color: var(--text-primary);
  outline: none;
  min-width: 200px;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-tertiary); }

.filter-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  padding: 6px 10px;
  user-select: none;
}

.active-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-top: 8px;
}
.active-filter-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 500;
}
.active-filter-tag button {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
  padding: 0 2px;
  opacity: 0.7;
}
.active-filter-tag button:hover { opacity: 1; }
.clear-filters {
  font-size: 0.7rem;
  color: var(--text-tertiary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  text-decoration: underline;
}
.clear-filters:hover { color: var(--text-secondary); }

/* ── Feature Board ────────────────────────────────────────────── */
.board-section { padding: 24px 0; }
.board {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding-bottom: 16px;
  min-height: 300px;
}
.board-column {
  flex: 0 0 340px;
  min-width: 340px;
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 300px);
}
.column-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-secondary);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  z-index: 2;
}
.column-title {
  font-size: 0.9rem;
  font-weight: 700;
  margin-bottom: 2px;
}
.column-desc {
  font-size: 0.75rem;
  color: var(--text-tertiary);
}
.column-count {
  font-size: 0.7rem;
  color: var(--text-tertiary);
  margin-top: 4px;
}
.column-cards {
  padding: 12px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Feature card */
.feature-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  border-left: 4px solid var(--border);
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.feature-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.feature-card.highlight {
  box-shadow: 0 0 0 2px var(--accent), var(--shadow-md);
}
.feature-card[data-priority="must"] { border-left-color: var(--must); }
.feature-card[data-priority="should"] { border-left-color: var(--should); }
.feature-card[data-priority="could"] { border-left-color: var(--could); }
.feature-card[data-priority="wont"] { border-left-color: var(--wont); }

/* Accepted cards get a green glow */
.feature-card.status-accepted {
  box-shadow: inset 0 0 0 1px var(--status-accepted), var(--shadow-sm);
}
/* Dismissed cards get reduced opacity */
.feature-card.status-dismissed {
  opacity: 0.45;
}
.feature-card.status-dismissed .card-title {
  text-decoration: line-through;
}

/* ── Card Action Buttons (thumbs up/down) ──────────────────────
 * Positioned absolute top-right, hidden by default, shown on hover.
 * Always visible on accepted/dismissed cards.
 * Hidden entirely on created cards (already has a GH issue).
 */
.card-actions {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
}
.feature-card:hover .card-actions {
  opacity: 1;
}
.card-actions button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  padding: 0;
  color: var(--text-tertiary);
}
.card-actions button svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card-actions button:hover {
  transform: scale(1.15);
}
.card-actions .btn-accept:hover {
  background: #d1fae5;
  border-color: var(--status-accepted);
  color: #059669;
}
.card-actions .btn-dismiss:hover {
  background: #fee2e2;
  border-color: var(--status-dismissed);
  color: #dc2626;
}
[data-theme="dark"] .card-actions .btn-accept:hover {
  background: #064e3b;
  color: #34d399;
}
[data-theme="dark"] .card-actions .btn-dismiss:hover {
  background: #7f1d1d;
  color: #f87171;
}
/* Highlight active action, keep both clickable for toggle-off */
.feature-card.status-accepted .btn-accept {
  background: #d1fae5;
  border-color: var(--status-accepted);
  color: #059669;
  opacity: 1;
}
.feature-card.status-dismissed .btn-dismiss {
  background: #fee2e2;
  border-color: var(--status-dismissed);
  color: #dc2626;
  opacity: 1;
}
[data-theme="dark"] .feature-card.status-accepted .btn-accept {
  background: #064e3b;
  color: #34d399;
}
[data-theme="dark"] .feature-card.status-dismissed .btn-dismiss {
  background: #7f1d1d;
  color: #f87171;
}
/* Always show actions on actioned cards */
.feature-card.status-accepted .card-actions,
.feature-card.status-dismissed .card-actions {
  opacity: 1;
}
/* Created cards (GH issue exists) — no review actions needed */
.feature-card.status-created .card-actions {
  display: none;
}

/* ── Note button in card actions ─────────────────────────────── */
.card-actions .btn-note {
  color: var(--text-tertiary);
}
.card-actions .btn-note:hover {
  background: #e0e7ff;
  border-color: #6366f1;
  color: #4f46e5;
}
[data-theme="dark"] .card-actions .btn-note:hover {
  background: #312e81;
  color: #a5b4fc;
}
/* Note button stays visually active when card already has a note */
.feature-card.has-note .btn-note {
  color: #6366f1;
  border-color: #6366f1;
  background: #eef2ff;
}
[data-theme="dark"] .feature-card.has-note .btn-note {
  color: #a5b4fc;
  border-color: #6366f1;
  background: #312e81;
}
/* Always show actions when card has a note (not just on hover) */
.feature-card.has-note .card-actions {
  opacity: 1;
}

/* ── Card note display (inline below rationale) ──────────────── */
.card-note {
  background: #eef2ff;
  border: 1px solid #c7d2fe;
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 0.72rem;
  color: #4338ca;
  line-height: 1.5;
  position: relative;
}
.card-note::before {
  content: 'Note';
  display: block;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  opacity: 0.7;
}
[data-theme="dark"] .card-note {
  background: #1e1b4b;
  border-color: #3730a3;
  color: #c7d2fe;
}

/* ── Note modal overlay ───────────────────────────────────────── */
.note-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.note-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.note-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  width: 90%;
  max-width: 520px;
  padding: 24px;
  transform: translateY(10px);
  transition: transform 0.2s;
}
.note-overlay.open .note-modal {
  transform: translateY(0);
}
.note-modal h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text-primary);
}
.note-modal .note-subtitle {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}
.note-modal textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 0.8rem;
  line-height: 1.5;
  resize: vertical;
}
.note-modal textarea:focus {
  outline: none;
  border-color: #6366f1;
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.note-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.note-modal-actions button {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.note-modal-actions .btn-cancel {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.note-modal-actions .btn-cancel:hover {
  background: var(--bg-secondary);
}
.note-modal-actions .btn-save-note {
  background: #6366f1;
  border: 1px solid #6366f1;
  color: #fff;
}
.note-modal-actions .btn-save-note:hover {
  background: #4f46e5;
}
.note-modal-actions .btn-delete-note {
  background: transparent;
  border: 1px solid #ef4444;
  color: #ef4444;
  margin-right: auto;
}
.note-modal-actions .btn-delete-note:hover {
  background: #fef2f2;
}
[data-theme="dark"] .note-modal-actions .btn-delete-note:hover {
  background: #7f1d1d;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
}
.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 5px;
}
/* GitHub octicon prefix on created cards */
.gh-link {
  color: var(--text-tertiary);
  display: inline-flex;
  flex-shrink: 0;
  transition: color 0.15s;
}
.gh-link:hover {
  color: var(--text-primary);
}
.gh-link svg {
  width: 14px;
  height: 14px;
}
.card-expand-icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  color: var(--text-tertiary);
  transition: transform 0.2s;
}
.feature-card.expanded .card-expand-icon { transform: rotate(180deg); }

.card-description {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.feature-card.expanded .card-description {
  -webkit-line-clamp: unset;
  overflow: visible;
}

.card-pills {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 600;
  white-space: nowrap;
}
/* Complexity pills */
.pill-complexity-low { background: #ECFDF5; color: #059669; }
.pill-complexity-medium { background: #FFFBEB; color: #D97706; }
.pill-complexity-high { background: #FEF2F2; color: #DC2626; }
[data-theme="dark"] .pill-complexity-low { background: #1A3A2A; color: #34D399; }
[data-theme="dark"] .pill-complexity-medium { background: #45381A; color: #FBBF24; }
[data-theme="dark"] .pill-complexity-high { background: #451A1A; color: #F87171; }
/* Impact pills */
.pill-impact-low { background: #F3F4F6; color: #6B7280; }
.pill-impact-medium { background: #EFF6FF; color: #2563EB; }
.pill-impact-high { background: #F5F3FF; color: #7C3AED; }
[data-theme="dark"] .pill-impact-low { background: #252838; color: #94A3B8; }
[data-theme="dark"] .pill-impact-medium { background: #1A2745; color: #60A5FA; }
[data-theme="dark"] .pill-impact-high { background: #2D1B5E; color: #A78BFA; }

/* Source pills */
.pill-source {
  font-size: 0.65rem;
  font-weight: 600;
}
.pill-source-ideation { background: var(--src-ideation-bg); color: var(--src-ideation); }
.pill-source-competitive { background: var(--src-competitive-bg); color: var(--src-competitive); }
.pill-source-blindspot { background: var(--src-blindspot-bg); color: var(--src-blindspot); }
.pill-source-team-momentum { background: var(--src-momentum-bg); color: var(--src-momentum); }
.pill-source-open-issue { background: var(--src-open-issue-bg); color: var(--src-open-issue); }

/* Status pills */
.pill-status-pending { background: var(--status-pending-bg); color: var(--status-pending); }
.pill-status-accepted { background: var(--status-accepted-bg); color: var(--status-accepted); }
.pill-status-dismissed { background: var(--status-dismissed-bg); color: var(--status-dismissed); }
.pill-status-created { background: var(--status-created-bg); color: var(--status-created); }
.pill-status-created a { color: inherit; text-decoration: none; }
.pill-status-created a:hover { text-decoration: underline; }

/* Expanded card details */
.card-details {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
}
.feature-card.expanded .card-details { display: block; }

.detail-section { margin-bottom: 12px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}
.detail-list {
  list-style: none;
  padding: 0;
}
.detail-list li {
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 3px 0;
  padding-left: 14px;
  position: relative;
  line-height: 1.45;
}
.detail-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text-tertiary);
}

/* Dependency badges */
.dep-badges {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.dep-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  font-weight: 500;
  background: var(--bg-tertiary);
  color: var(--accent);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}
.dep-badge:hover { background: var(--accent-light); border-color: var(--accent); }
.dep-badge svg { width: 12px; height: 12px; }

/* Related issues */
.issue-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  color: var(--accent);
  text-decoration: none;
  padding: 2px 0;
}
.issue-link:hover { text-decoration: underline; }

/* GH Issue link on card */
.gh-issue-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  color: var(--text-tertiary);
  text-decoration: none;
  margin-top: 8px;
}
.gh-issue-link:hover { color: var(--accent); }

/* ── Milestones ───────────────────────────────────────────────── */
.milestones-section {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
.milestone-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-secondary);
  padding: 3px 0;
}
.milestone-icon {
  width: 14px;
  height: 14px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

/* ── Competitive Analysis ─────────────────────────────────────── */
.competitive-section {
  padding: 24px 0;
  border-top: 1px solid var(--border);
}
.collapsible-header {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  padding: 12px 0;
  user-select: none;
}
.collapsible-header:hover .collapsible-title { color: var(--accent); }
.collapsible-title {
  font-size: 1.05rem;
  font-weight: 700;
  transition: color 0.15s;
}
.collapsible-icon {
  width: 20px;
  height: 20px;
  color: var(--text-tertiary);
  transition: transform 0.2s;
}
.collapsible-header.open .collapsible-icon { transform: rotate(180deg); }
.collapsible-body {
  display: none;
  padding-top: 12px;
}
.collapsible-body.open { display: block; }

.comp-table-wrapper { overflow-x: auto; }
.comp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}
.comp-table th, .comp-table td {
  padding: 10px 14px;
  border: 1px solid var(--border);
  text-align: left;
}
.comp-table th {
  background: var(--bg-tertiary);
  font-weight: 600;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-secondary);
  position: sticky;
  top: 0;
}
.comp-table td { background: var(--bg-card); }
.comp-table tr:hover td { background: var(--bg-hover); }
.comp-check { color: #10B981; font-weight: bold; }
.comp-cross { color: #EF4444; }
.comp-unknown { color: var(--text-tertiary); }

/* ── Statistics Footer ────────────────────────────────────────── */
.stats-footer {
  padding: 28px 0;
  border-top: 1px solid var(--border);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
}
.stat-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}
.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.2;
}
.stat-sub {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 4px;
}
.stat-breakdown {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.stat-breakdown-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  color: var(--text-secondary);
}
.stat-breakdown-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* ── Save Toast ───────────────────────────────────────────────── */
.save-toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--bg-card);
  border: 1px solid var(--status-accepted);
  color: var(--text-primary);
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-size: 0.8rem;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  z-index: 200;
}
.save-toast.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ── No Results ───────────────────────────────────────────────── */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.no-results-icon { font-size: 2rem; margin-bottom: 12px; }
.no-results-text { font-size: 0.9rem; }

/* ── Rationale tooltip ────────────────────────────────────────── */
.rationale {
  font-size: 0.75rem;
  color: var(--text-secondary);
  font-style: italic;
  margin-top: 4px;
  line-height: 1.4;
}

/* ── Scrollbar ────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ── Target audience ──────────────────────────────────────────── */
.audience-info {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 6px;
}
.audience-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 500;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.audience-badge.primary { background: var(--accent-light); color: var(--accent); border-color: transparent; }

/* ── Responsive ───────────────────────────────────────────────── */
@media (max-width: 768px) {
  .header-inner { flex-direction: column; }
  .header-right { width: 100%; justify-content: flex-end; }
  .board-column { flex: 0 0 300px; min-width: 300px; }
  .filters-row { gap: 6px; }
  .filter-group { flex-wrap: wrap; }
  .search-input { min-width: 100%; }
  .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}

/* ── Empty state for columns ──────────────────────────────────── */
.column-empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-tertiary);
  font-size: 0.8rem;
}
</style>

<script>
const ROADMAP_DATA = {{ROADMAP_DATA}};
</script>

<div id="app"></div>

<script>
(function() {
  'use strict';

  const data = ROADMAP_DATA;

  // ── Helpers ──────────────────────────────────────────────────
  function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    } catch(e) { return iso; }
  }

  // Parse source string into type and detail
  // e.g. "ideation:ci-003" -> { type: "ideation", detail: "ci-003" }
  // e.g. "competitive" -> { type: "competitive", detail: null }
  // e.g. "open-issue:15" -> { type: "open-issue", detail: "15" }
  function parseSource(src) {
    if (!src) return { type: 'unknown', detail: null };
    const parts = src.split(':');
    return { type: parts[0], detail: parts[1] || null };
  }

  function sourceLabel(type) {
    const map = {
      'ideation': 'Ideation',
      'competitive': 'Competitive',
      'blindspot': 'Blindspot',
      'team-momentum': 'Momentum',
      'open-issue': 'Open Issue'
    };
    return map[type] || type;
  }

  // Build a feature lookup by ID for quick dependency resolution
  const featureMap = {};
  (data.features || []).forEach(f => { featureMap[f.id] = f; });

  // Build phase lookup
  const phaseMap = {};
  (data.phases || []).forEach(p => { phaseMap[p.id] = p; });

  // ── State ────────────────────────────────────────────────────
  const state = {
    filters: {
      priority: 'all',
      complexity: 'all',
      impact: 'all',
      source: 'all',
      phase: 'all',
      status: 'all',
      search: ''
    },
    expandedCards: new Set()
  };

  // ── Theme ────────────────────────────────────────────────────
  function initTheme() {
    const saved = localStorage.getItem('roadmap-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('roadmap-theme', next);
  }

  initTheme();

  // ── Status Management ────────────────────────────────────────
  // Statuses are stored in-memory (mutating ROADMAP_DATA) + localStorage for persistence across reloads.
  // On reload, overrides are reconciled: stale ones (already synced, or status=created) are discarded.
  const STATUS_STORAGE_KEY = 'roadmap-statuses-' + (data.id || 'default');
  let hasUnsavedChanges = false;

  function initStatusOverrides() {
    try {
      const saved = JSON.parse(localStorage.getItem(STATUS_STORAGE_KEY) || '{}');
      const stillNeeded = {};
      (data.features || []).forEach(feature => {
        const override = saved[feature.id];
        if (!override) return;
        // If the JSON already has this status (or a more advanced one like "created"), the override is stale
        if (feature.status === override || feature.status === 'created') return;
        // Still pending in JSON but user already reviewed it in browser — apply override
        feature.status = override;
        feature.reviewed_at = feature.reviewed_at || new Date().toISOString();
        stillNeeded[feature.id] = override;
      });
      if (Object.keys(stillNeeded).length > 0) {
        localStorage.setItem(STATUS_STORAGE_KEY, JSON.stringify(stillNeeded));
        hasUnsavedChanges = true;
      } else {
        localStorage.removeItem(STATUS_STORAGE_KEY);
        hasUnsavedChanges = false;
      }
    } catch {}
  }

  function getFeatureStatus(id) {
    const f = (data.features || []).find(f => f.id === id);
    return f ? (f.status || 'pending') : null;
  }

  function setFeatureStatus(featureId, status) {
    const feature = (data.features || []).find(f => f.id === featureId);
    if (!feature) return;
    // Never allow changing status on features that already have GH issues
    if (feature.status === 'created') return;
    // Toggle: clicking the same action again resets to pending
    feature.status = feature.status === status ? 'pending' : status;
    feature.reviewed_at = new Date().toISOString();
    // Persist all non-pending statuses to localStorage
    const overrides = {};
    (data.features || []).forEach(f => {
      if (f.status && f.status !== 'pending') overrides[f.id] = f.status;
    });
    localStorage.setItem(STATUS_STORAGE_KEY, JSON.stringify(overrides));
    hasUnsavedChanges = true;
    updateSyncButton();
    // Re-render to reflect new state
    render();
    // Restore scroll position and keep the card expanded if it was
    showToast(feature.status === 'pending' ? 'Reset to pending' : feature.status.charAt(0).toUpperCase() + feature.status.slice(1));
  }

  function updateSyncButton() {
    const features = data.features || [];
    const acceptedCount = features.filter(f => f.status === 'accepted').length;
    const dismissedCount = features.filter(f => f.status === 'dismissed').length;
    const needsIssueCount = features.filter(f => f.status === 'accepted' && !f.gh_issue).length;
    const reviewedCount = acceptedCount + dismissedCount;
    const show = hasUnsavedChanges && reviewedCount > 0;
    const syncBtn = document.getElementById('sync-btn');
    const badge = document.getElementById('sync-count');
    if (syncBtn) {
      syncBtn.style.display = show ? 'inline-flex' : 'none';
      syncBtn.title = `${acceptedCount} accepted (${needsIssueCount} need GH issues), ${dismissedCount} dismissed — copy prompt to clipboard`;
    }
    if (badge) badge.textContent = reviewedCount;
  }

  function showToast(msg) {
    let toast = document.getElementById('save-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'save-toast';
      toast.className = 'save-toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('visible');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('visible'); }, 2500);
  }

  // ── Build Claude Prompt ──────────────────────────────────────
  // Generates a full instructions prompt for Claude Code to:
  //   1. Update roadmap.json feature statuses
  //   2. Create GH issues for accepted features without existing ones
  //      (includes acceptance criteria, user stories, phase info in the issue body)
  //   3. Update issues-tracker.json
  //   4. Regenerate report.html
  function buildClaudePrompt() {
    const features = data.features || [];
    const accepted = features.filter(f => f.status === 'accepted');
    const dismissed = features.filter(f => f.status === 'dismissed');
    const needsIssue = accepted.filter(f => !f.gh_issue);
    const alreadyHasIssue = accepted.filter(f => f.gh_issue);
    const projectName = data.project_name || 'unknown';

    const reportPath = window.location.pathname;
    const roadmapDir = reportPath.replace(/\/report\.html$/, '');
    const roadmapJsonPath = roadmapDir + '/roadmap.json';
    const trackerPath = roadmapDir + '/issues-tracker.json';

    let prompt = `Update the roadmap review for project "${projectName}" and create GitHub issues for accepted features.\n\n`;
    prompt += `Files:\n`;
    prompt += `- Roadmap JSON: ${roadmapJsonPath}\n`;
    prompt += `- Issues tracker: ${trackerPath}\n`;
    prompt += `- Report: ${roadmapDir}/report.html\n\n`;
    prompt += `Total features: ${features.length} | Reviewed: ${accepted.length + dismissed.length} | Accepted: ${accepted.length} | Dismissed: ${dismissed.length}\n\n`;

    // Collect pending features that have notes — include them so Claude can persist the notes
    const withNotes = features.filter(f => f.user_note && f.status !== 'accepted' && f.status !== 'dismissed');

    if (accepted.length > 0) {
      prompt += `## Accepted Features (${accepted.length})\n\n`;
      accepted.forEach(f => {
        const phase = phaseMap[f.phase_id];
        const phaseName = phase ? phase.name : (f.phase_id || 'unknown');
        const hasIssue = f.gh_issue ? ` [already has Issue #${f.gh_issue.number}]` : ' [NEEDS GH ISSUE]';
        prompt += `- **${f.id}**: "${f.title}" (priority: ${f.priority}, phase: ${phaseName}, complexity: ${f.complexity || 'unknown'})${hasIssue}\n`;
        if (f.user_note) prompt += `  > **User note:** ${f.user_note}\n`;
      });
      prompt += `\n`;
    }

    if (dismissed.length > 0) {
      prompt += `## Dismissed Features (${dismissed.length})\n\n`;
      dismissed.forEach(f => {
        const reason = f.dismissed_reason ? ` — reason: "${f.dismissed_reason}"` : '';
        prompt += `- **${f.id}**: "${f.title}"${reason}\n`;
        if (f.user_note) prompt += `  > **User note:** ${f.user_note}\n`;
      });
      prompt += `\n`;
    }

    if (withNotes.length > 0) {
      prompt += `## Pending Features with Notes (${withNotes.length})\n\n`;
      withNotes.forEach(f => {
        prompt += `- **${f.id}**: "${f.title}"\n`;
        prompt += `  > **User note:** ${f.user_note}\n`;
      });
      prompt += `\nFor these features: update the "user_note" field in roadmap.json and use the note as context when Claude processes this feature (e.g., refine the description, adjust the approach, or flag concerns).\n\n`;
    }

    prompt += `## Instructions\n\n`;
    prompt += `### Step 1: Update roadmap.json\n`;
    prompt += `1. Read ${roadmapJsonPath}\n`;
    prompt += `2. For each feature listed above, update its "status" to "accepted" or "dismissed", set "reviewed_at" to current ISO timestamp, and if a user note is provided, set "user_note" to that text\n`;
    prompt += `3. Set metadata.updated_at to current ISO timestamp\n`;
    prompt += `4. Write the updated JSON back\n\n`;

    if (needsIssue.length > 0) {
      prompt += `### Step 2: Create GitHub Issues (${needsIssue.length} issues)\n\n`;
      prompt += `For each accepted feature that needs a GH issue, run:\n\n`;
      prompt += `\`\`\`\n`;
      prompt += `gh issue create --title "{title}" --body "{body}" --label "roadmap,{priority}-priority,roadmap-generated"\n`;
      prompt += `\`\`\`\n\n`;
      prompt += `Issue body format:\n`;
      prompt += `\`\`\`markdown\n`;
      prompt += `## {title}\n\n`;
      prompt += `{description}\n\n`;
      prompt += `### Phase\n`;
      prompt += `{phase_name} ({phase_id})\n\n`;
      prompt += `### Priority\n`;
      prompt += `{priority} (MoSCoW)\n\n`;
      prompt += `### User Stories\n`;
      prompt += `{list of user_stories as bullet points}\n\n`;
      prompt += `### Acceptance Criteria\n`;
      prompt += `{list of acceptance_criteria as bullet points}\n\n`;
      prompt += `### Rationale\n`;
      prompt += `{rationale}\n\n`;
      prompt += `### Complexity / Impact\n`;
      prompt += `Complexity: {complexity} | Impact: {impact}\n\n`;
      prompt += `---\n`;
      prompt += `*Generated by bvdr-ideation-and-roadmap plugin — Source: {source} — {id}*\n`;
      prompt += `\`\`\`\n\n`;
      prompt += `Features that need issues:\n`;
      needsIssue.forEach(f => {
        const phase = phaseMap[f.phase_id];
        const phaseName = phase ? phase.name : (f.phase_id || 'unknown');
        prompt += `- ${f.id}: "${f.title}" → priority: ${f.priority}, phase: ${phaseName}, complexity: ${f.complexity || 'unknown'}, impact: ${f.impact || 'unknown'}\n`;
      });
      prompt += `\n`;
      prompt += `After creating each issue:\n`;
      prompt += `1. Update the feature's "status" to "created" in roadmap.json\n`;
      prompt += `2. Set "gh_issue": { "number": <issue_number>, "url": "<issue_url>" }\n`;
      prompt += `3. Append to ${trackerPath} (create if doesn't exist):\n`;
      prompt += `   { "created_issues": [{ "feature_id": "<id>", "gh_issue_number": <n>, "gh_issue_url": "<url>", "created_at": "<ISO>" }] }\n`;
      prompt += `4. Check issues-tracker.json before creating — skip if feature_id already exists\n\n`;
    }

    if (alreadyHasIssue.length > 0) {
      prompt += `### Already has GH issues (skip these):\n`;
      alreadyHasIssue.forEach(f => {
        prompt += `- ${f.id}: Issue #${f.gh_issue.number}\n`;
      });
      prompt += `\n`;
    }

    prompt += `### Step ${needsIssue.length > 0 ? '3' : '2'}: Regenerate report.html\n`;
    prompt += `Find the roadmap-report-template.html from the bvdr-ideation-and-roadmap plugin, replace {{ROADMAP_DATA}} with the updated roadmap.json content, and write to ${roadmapDir}/report.html\n`;

    return prompt;
  }

  function copyClaudePrompt() {
    const prompt = buildClaudePrompt();
    if (!prompt) return;
    try {
      navigator.clipboard.writeText(prompt);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = prompt;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    showToast('Copied to clipboard! Paste in Claude Code.');
  }

  // ── Priority pill filtering ───────────────────────────────────
  // Same pattern as ideation type badges: click to filter, click again to clear.
  function syncPriorityPillStates() {
    document.querySelectorAll('.priority-pill').forEach(pill => {
      const p = pill.getAttribute('data-priority');
      pill.classList.toggle('active', p === state.filters.priority);
      pill.classList.toggle('dimmed', state.filters.priority !== 'all' && p !== state.filters.priority);
    });
  }

  function togglePriorityPill(priority) {
    state.filters.priority = state.filters.priority === priority ? 'all' : priority;
    syncPriorityPillStates();
    render();
  }

  // ── Filtering ────────────────────────────────────────────────
  function matchesFilters(feature) {
    const f = state.filters;
    if (f.priority !== 'all' && feature.priority !== f.priority) return false;
    if (f.complexity !== 'all' && feature.complexity !== f.complexity) return false;
    if (f.impact !== 'all' && feature.impact !== f.impact) return false;
    if (f.status !== 'all' && feature.status !== f.status) return false;
    if (f.phase !== 'all' && feature.phase_id !== f.phase) return false;
    if (f.source !== 'all') {
      const src = parseSource(feature.source);
      if (src.type !== f.source) return false;
    }
    if (f.search) {
      const q = f.search.toLowerCase();
      const haystack = (feature.title + ' ' + (feature.description || '')).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  }

  function getFilteredFeatures() {
    return (data.features || []).filter(matchesFilters);
  }

  // Sort features: dismissed always go to the bottom within a column
  function getSortedFeaturesForColumn(features) {
    return [...features].sort((a, b) => {
      const aDismissed = a.status === 'dismissed' ? 1 : 0;
      const bDismissed = b.status === 'dismissed' ? 1 : 0;
      return aDismissed - bDismissed;
    });
  }

  function getActiveFilterCount() {
    let count = 0;
    const f = state.filters;
    if (f.priority !== 'all') count++;
    if (f.complexity !== 'all') count++;
    if (f.impact !== 'all') count++;
    if (f.source !== 'all') count++;
    if (f.phase !== 'all') count++;
    if (f.status !== 'all') count++;
    if (f.search) count++;
    return count;
  }

  // ── Render ───────────────────────────────────────────────────
  function render() {
    const app = document.getElementById('app');
    const filtered = getFilteredFeatures();

    // Group features by phase
    const phaseFeatures = {};
    (data.phases || []).forEach(p => { phaseFeatures[p.id] = []; });
    filtered.forEach(f => {
      if (phaseFeatures[f.phase_id]) {
        phaseFeatures[f.phase_id].push(f);
      }
    });

    app.innerHTML = `
      ${renderHeader()}
      <div class="container">
        ${renderPriorityPills()}
        ${renderTimeline()}
        ${renderFilters()}
        ${renderBoard(phaseFeatures)}
        ${renderCompetitiveAnalysis()}
        ${renderStats()}
      </div>
    `;

    bindEvents();
    updateSyncButton();
    syncPriorityPillStates();
  }

  function renderHeader() {
    const ta = data.target_audience;
    return `
    <header class="header">
      <div class="container">
        <div class="header-inner">
          <div class="header-left">
            <h1 class="project-name">${esc(data.project_name || 'Roadmap')}</h1>
            ${data.vision ? `<p class="vision-text">${esc(data.vision)}</p>` : ''}
            <div class="header-meta">
              ${data.version ? `<span class="badge badge-accent">v${esc(data.version)}</span>` : ''}
              <span class="badge badge-muted">${esc(formatDate(data.metadata?.created_at))}</span>
              ${data.metadata?.prioritization_framework ? `<span class="badge badge-muted">${esc(data.metadata.prioritization_framework)}</span>` : ''}
            </div>
            ${ta ? `
            <div class="audience-info">
              ${ta.primary ? `<span class="audience-badge primary">${esc(ta.primary)}</span>` : ''}
              ${(ta.secondary || []).map(s => `<span class="audience-badge">${esc(s)}</span>`).join('')}
            </div>` : ''}
          </div>
          <div class="header-right">
            <!-- Sync button only shown when there are unsaved status changes -->
            <button class="sync-btn" id="sync-btn" title="Copy sync prompt to clipboard" onclick="copyClaudePromptGlobal()" style="display:none">
              <svg viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
              Copy <span class="sync-badge" id="sync-count">0</span>
            </button>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">
              <svg class="icon-sun" width="18" height="18"><use href="#icon-sun"/></svg>
              <svg class="icon-moon" width="18" height="18"><use href="#icon-moon"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>`;
  }

  // MoSCoW priority pills — act as quick filter toggles (same as type badges in ideation)
  function renderPriorityPills() {
    const features = data.features || [];
    const counts = { must: 0, should: 0, could: 0, wont: 0 };
    features.forEach(f => { if (counts[f.priority] !== undefined) counts[f.priority]++; });
    const labels = { must: 'Must Have', should: 'Should Have', could: 'Could Have', wont: "Won't Have" };

    return `
    <div class="priority-pills" style="padding: 16px 0 8px">
      ${Object.entries(counts).filter(([,c]) => c > 0).map(([p, c]) => `
        <span class="priority-pill" data-priority="${p}" onclick="togglePriorityPillGlobal('${p}')">${esc(labels[p])} <span class="pill-count">${c}</span></span>
      `).join('')}
    </div>`;
  }

  function renderTimeline() {
    const phases = data.phases || [];
    if (phases.length === 0) return '';

    return `
    <section class="timeline-section">
      <div class="section-title">Phase Timeline</div>
      <div class="timeline">
        ${phases.sort((a, b) => a.order - b.order).map(phase => {
          const features = (data.features || []).filter(f => f.phase_id === phase.id);
          const moscowDots = features.map(f =>
            `<span class="moscow-dot" data-priority="${esc(f.priority)}"></span>`
          ).join('');
          return `
          <div class="timeline-phase" data-status="${esc(phase.status)}" data-phase-id="${esc(phase.id)}">
            <div class="timeline-dot"></div>
            <div class="timeline-phase-name">${esc(phase.name)}</div>
            <div class="timeline-phase-count">${features.length} feature${features.length !== 1 ? 's' : ''}</div>
            <div class="moscow-dots">${moscowDots}</div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
  }

  function renderFilters() {
    const phases = (data.phases || []).sort((a, b) => a.order - b.order);
    const f = state.filters;

    // Collect active filters for display
    const activeTags = [];
    if (f.priority !== 'all') activeTags.push({ key: 'priority', label: 'Priority: ' + f.priority });
    if (f.complexity !== 'all') activeTags.push({ key: 'complexity', label: 'Complexity: ' + f.complexity });
    if (f.impact !== 'all') activeTags.push({ key: 'impact', label: 'Impact: ' + f.impact });
    if (f.source !== 'all') activeTags.push({ key: 'source', label: 'Source: ' + sourceLabel(f.source) });
    if (f.phase !== 'all') {
      const p = phaseMap[f.phase];
      activeTags.push({ key: 'phase', label: 'Phase: ' + (p ? p.name : f.phase) });
    }
    if (f.status !== 'all') activeTags.push({ key: 'status', label: 'Status: ' + f.status });
    if (f.search) activeTags.push({ key: 'search', label: 'Search: "' + f.search + '"' });

    return `
    <section class="filters-section">
      <div class="filters-row">
        <input type="text" class="search-input" id="filter-search" placeholder="Search features..." value="${esc(f.search)}">
        ${renderFilterGroup('complexity', ['all', 'low', 'medium', 'high'], f.complexity)}
        ${renderFilterGroup('impact', ['all', 'low', 'medium', 'high'], f.impact)}
        ${renderFilterGroup('source', ['all', 'ideation', 'competitive', 'blindspot', 'team-momentum', 'open-issue'], f.source)}
        ${renderFilterGroup('status', ['all', 'pending', 'accepted', 'dismissed', 'created'], f.status)}
        ${phases.length > 1 ? renderFilterGroup('phase', ['all'].concat(phases.map(p => p.id)), f.phase, phases) : ''}
      </div>
      ${activeTags.length > 0 ? `
      <div class="active-filters">
        ${activeTags.map(t => `
          <span class="active-filter-tag">${esc(t.label)}<button data-clear-filter="${t.key}">&times;</button></span>
        `).join('')}
        <button class="clear-filters" id="clear-all-filters">Clear all</button>
      </div>` : ''}
    </section>`;
  }

  function renderFilterGroup(name, options, current, phaseLookup) {
    const labelMap = {
      'complexity': 'Complexity',
      'impact': 'Impact',
      'source': 'Source',
      'status': 'Status',
      'phase': 'Phase'
    };
    return `
    <div class="filter-group">
      <span class="filter-label">${labelMap[name] || name}</span>
      ${options.map(opt => {
        let label = opt;
        if (name === 'phase' && opt !== 'all' && phaseLookup) {
          const p = phaseLookup.find(ph => ph.id === opt);
          label = p ? p.name : opt;
        }
        if (name === 'source' && opt !== 'all') {
          label = sourceLabel(opt);
        }
        const displayLabel = label === 'all' ? 'All' : label === 'wont' ? "Won't" : label.charAt(0).toUpperCase() + label.slice(1);
        return `<button class="filter-btn ${opt === current ? 'active' : ''}" data-filter="${name}" data-value="${esc(opt)}">${esc(displayLabel)}</button>`;
      }).join('')}
    </div>`;
  }

  function renderBoard(phaseFeatures) {
    const phases = (data.phases || []).sort((a, b) => a.order - b.order);
    const filtered = getFilteredFeatures();

    if (filtered.length === 0 && getActiveFilterCount() > 0) {
      return `
      <section class="board-section">
        <div class="no-results">
          <div class="no-results-icon">&#128269;</div>
          <div class="no-results-text">No features match your filters. Try adjusting or clearing them.</div>
        </div>
      </section>`;
    }

    return `
    <section class="board-section">
      <div class="board">
        ${phases.map(phase => {
          // Sort dismissed features to the bottom within each column
          const features = getSortedFeaturesForColumn(phaseFeatures[phase.id] || []);
          return `
          <div class="board-column" data-phase-id="${esc(phase.id)}">
            <div class="column-header">
              <div class="column-title">${esc(phase.name)}</div>
              ${phase.description ? `<div class="column-desc">${esc(phase.description)}</div>` : ''}
              <div class="column-count">${features.length} feature${features.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="column-cards">
              ${features.length === 0 ? '<div class="column-empty">No matching features</div>' : ''}
              ${features.map(f => renderFeatureCard(f)).join('')}
              ${renderMilestones(phase)}
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
  }

  function renderFeatureCard(feature) {
    const src = parseSource(feature.source);
    const isExpanded = state.expandedCards.has(feature.id);
    const expandedClass = isExpanded ? ' expanded' : '';
    const featureStatus = getFeatureStatus(feature.id) || feature.status || 'pending';
    const statusClass = featureStatus ? ' status-' + featureStatus : '';

    // GitHub icon before title for created features that have an issue
    let ghTitlePrefix = '';
    if (featureStatus === 'created' && feature.gh_issue) {
      const href = feature.gh_issue.url ? esc(feature.gh_issue.url) : '#';
      const issueNum = feature.gh_issue.number || '';
      ghTitlePrefix = `<a href="${href}" target="_blank" rel="noopener" class="gh-link" title="View Issue${issueNum ? ' #' + issueNum : ''} on GitHub"><svg width="14" height="14"><use href="#icon-github"/></svg></a>`;
    }

    // Status pill for the card pills row
    let statusPill = '';
    if (featureStatus === 'accepted') {
      statusPill = '<span class="pill pill-status-accepted">Accepted</span>';
    } else if (featureStatus === 'dismissed') {
      statusPill = '<span class="pill pill-status-dismissed">Dismissed</span>';
    } else if (featureStatus === 'created') {
      if (feature.gh_issue && feature.gh_issue.url) {
        statusPill = `<span class="pill pill-status-created"><a href="${esc(feature.gh_issue.url)}" target="_blank" rel="noopener">Issue #${esc(String(feature.gh_issue.number))}</a></span>`;
      } else if (feature.gh_issue && feature.gh_issue.number) {
        statusPill = `<span class="pill pill-status-created">Issue #${esc(String(feature.gh_issue.number))}</span>`;
      } else {
        statusPill = '<span class="pill pill-status-created">Created</span>';
      }
    } else {
      statusPill = `<span class="pill pill-status-${esc(featureStatus)}">${esc(featureStatus)}</span>`;
    }

    return `
    <div class="feature-card${expandedClass}${statusClass}${feature.user_note ? ' has-note' : ''}" data-feature-id="${esc(feature.id)}" data-priority="${esc(feature.priority)}">
      <!-- Action buttons: accept, dismiss, note — hidden on created cards, always visible on accepted/dismissed/has-note -->
      <div class="card-actions">
        <button class="btn-accept" onclick="event.stopPropagation();setFeatureStatusGlobal('${esc(feature.id)}','accepted')" title="Accept">
          <svg viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
        </button>
        <button class="btn-dismiss" onclick="event.stopPropagation();setFeatureStatusGlobal('${esc(feature.id)}','dismissed')" title="Dismiss">
          <svg viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>
        </button>
        <button class="btn-note" onclick="event.stopPropagation();openNoteModalGlobal('${esc(feature.id)}')" title="Add note">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>
      <div class="card-header">
        <!-- GH icon before title for created features -->
        <span class="card-title">${ghTitlePrefix}${esc(feature.title)}</span>
        <svg class="card-expand-icon" width="18" height="18"><use href="#icon-chevron-down"/></svg>
      </div>
      ${feature.description ? `<div class="card-description">${esc(feature.description)}</div>` : ''}
      <div class="card-pills">
        ${statusPill}
        <span class="pill pill-complexity-${esc(feature.complexity)}">${esc(feature.complexity)} complexity</span>
        <span class="pill pill-impact-${esc(feature.impact)}">${esc(feature.impact)} impact</span>
        ${feature.source ? `<span class="pill pill-source pill-source-${esc(src.type)}">${esc(sourceLabel(src.type))}${src.detail ? ':' + esc(src.detail) : ''}</span>` : ''}
      </div>
      ${feature.user_note ? `<div class="card-note">${esc(feature.user_note)}</div>` : ''}
      <div class="card-details">
        ${feature.rationale ? `<div class="detail-section"><div class="rationale">${esc(feature.rationale)}</div></div>` : ''}

        ${feature.user_stories && feature.user_stories.length > 0 ? `
        <div class="detail-section">
          <div class="detail-label">User Stories</div>
          <ul class="detail-list">${feature.user_stories.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        </div>` : ''}

        ${feature.acceptance_criteria && feature.acceptance_criteria.length > 0 ? `
        <div class="detail-section">
          <div class="detail-label">Acceptance Criteria</div>
          <ul class="detail-list">${feature.acceptance_criteria.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        </div>` : ''}

        ${feature.dependencies && feature.dependencies.length > 0 ? `
        <div class="detail-section">
          <div class="detail-label">Dependencies</div>
          <div class="dep-badges">
            ${feature.dependencies.map(depId => {
              const dep = featureMap[depId];
              const label = dep ? dep.title : depId;
              return `<a class="dep-badge" data-dep-target="${esc(depId)}" href="#" title="Jump to ${esc(label)}">
                <svg width="12" height="12"><use href="#icon-link"/></svg>
                ${esc(label)}
              </a>`;
            }).join('')}
          </div>
        </div>` : ''}

        ${feature.related_issues && feature.related_issues.length > 0 ? `
        <div class="detail-section">
          <div class="detail-label">Related Issues</div>
          ${feature.related_issues.map(issue => `
            <div class="issue-link">#${esc(String(issue.number))} ${esc(issue.title)} <span class="pill badge-muted" style="margin-left:4px">${esc(issue.relationship)}</span></div>
          `).join('')}
        </div>` : ''}

        ${feature.dismissed_reason ? `
        <div class="detail-section">
          <div class="detail-label">Dismissed Reason</div>
          <p style="font-size:0.78rem;color:var(--text-secondary)">${esc(feature.dismissed_reason)}</p>
        </div>` : ''}
      </div>
    </div>`;
  }

  function renderMilestones(phase) {
    if (!phase.milestones || phase.milestones.length === 0) return '';
    return `
    <div class="milestones-section">
      <div class="detail-label" style="padding:0 4px">Milestones</div>
      ${phase.milestones.map(m => `
        <div class="milestone-item" title="${esc(m.description || '')}">
          <svg class="milestone-icon"><use href="#icon-flag"/></svg>
          <span>${esc(m.title)}</span>
          <span class="pill pill-status-${esc(m.status || 'planned')}" style="margin-left:auto">${esc(m.status || 'planned')}</span>
        </div>
      `).join('')}
    </div>`;
  }

  function renderCompetitiveAnalysis() {
    const featuresWithInsights = (data.features || []).filter(f =>
      (f.competitor_insight_ids && f.competitor_insight_ids.length > 0) || parseSource(f.source).type === 'competitive'
    );

    if (featuresWithInsights.length === 0) return '';

    return `
    <section class="competitive-section">
      <div class="collapsible-header" id="comp-toggle">
        <svg class="collapsible-icon"><use href="#icon-chevron-down"/></svg>
        <span class="collapsible-title">Competitive Analysis</span>
        <span class="badge badge-muted">${featuresWithInsights.length} feature${featuresWithInsights.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="collapsible-body" id="comp-body">
        <div class="comp-table-wrapper">
          <table class="comp-table">
            <thead>
              <tr>
                <th>Feature</th>
                <th>Priority</th>
                <th>Source</th>
                <th>Status</th>
                <th>Insights</th>
              </tr>
            </thead>
            <tbody>
              ${featuresWithInsights.map(f => {
                const src = parseSource(f.source);
                return `
                <tr>
                  <td><strong>${esc(f.title)}</strong></td>
                  <td><span class="pill" style="background:${priorityBg(f.priority)};color:${priorityColor(f.priority)}">${esc(f.priority)}</span></td>
                  <td><span class="pill pill-source pill-source-${esc(src.type)}">${esc(sourceLabel(src.type))}</span></td>
                  <td><span class="pill pill-status-${esc(f.status)}">${esc(f.status)}</span></td>
                  <td>${(f.competitor_insight_ids || []).map(id => `<span class="badge badge-muted">${esc(id)}</span>`).join(' ') || '<span class="comp-unknown">-</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </section>`;
  }

  function priorityColor(p) {
    const map = { must: 'var(--must)', should: 'var(--should)', could: 'var(--could)', wont: 'var(--wont)' };
    return map[p] || 'var(--text-secondary)';
  }
  function priorityBg(p) {
    const map = { must: 'var(--must-bg)', should: 'var(--should-bg)', could: 'var(--could-bg)', wont: 'var(--wont-bg)' };
    return map[p] || 'var(--bg-tertiary)';
  }

  function renderStats() {
    const features = data.features || [];
    const phases = data.phases || [];
    const meta = data.metadata || {};

    // Priority breakdown
    const byPriority = { must: 0, should: 0, could: 0, wont: 0 };
    features.forEach(f => { if (byPriority[f.priority] !== undefined) byPriority[f.priority]++; });

    // Source breakdown
    const bySource = {};
    features.forEach(f => {
      const src = parseSource(f.source).type;
      bySource[src] = (bySource[src] || 0) + 1;
    });

    // Source color map for dots
    const srcColorMap = {
      ideation: 'var(--src-ideation)',
      competitive: 'var(--src-competitive)',
      blindspot: 'var(--src-blindspot)',
      'team-momentum': 'var(--src-momentum)',
      'open-issue': 'var(--src-open-issue)'
    };

    return `
    <footer class="stats-footer">
      <div class="section-title">Statistics</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Phases</div>
          <div class="stat-value">${phases.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Features</div>
          <div class="stat-value">${features.length}</div>
          <div class="stat-breakdown">
            <span class="stat-breakdown-item"><span class="stat-breakdown-dot" style="background:var(--must)"></span> Must: ${byPriority.must}</span>
            <span class="stat-breakdown-item"><span class="stat-breakdown-dot" style="background:var(--should)"></span> Should: ${byPriority.should}</span>
            <span class="stat-breakdown-item"><span class="stat-breakdown-dot" style="background:var(--could)"></span> Could: ${byPriority.could}</span>
            <span class="stat-breakdown-item"><span class="stat-breakdown-dot" style="background:var(--wont)"></span> Won't: ${byPriority.wont}</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">By Source</div>
          <div class="stat-value">${Object.keys(bySource).length}</div>
          <div class="stat-breakdown">
            ${Object.entries(bySource).map(([src, count]) => `
              <span class="stat-breakdown-item"><span class="stat-breakdown-dot" style="background:${srcColorMap[src] || 'var(--text-tertiary)'}"></span> ${esc(sourceLabel(src))}: ${count}</span>
            `).join('')}
          </div>
        </div>
        ${meta.commits_analyzed != null ? `
        <div class="stat-card">
          <div class="stat-label">Commits Analyzed</div>
          <div class="stat-value">${meta.commits_analyzed.toLocaleString()}</div>
        </div>` : ''}
        ${meta.merged_prs_last_year != null ? `
        <div class="stat-card">
          <div class="stat-label">PRs Reviewed</div>
          <div class="stat-value">${meta.merged_prs_last_year.toLocaleString()}</div>
        </div>` : ''}
        ${meta.open_issues_analyzed != null ? `
        <div class="stat-card">
          <div class="stat-label">Issues Analyzed</div>
          <div class="stat-value">${meta.open_issues_analyzed.toLocaleString()}</div>
        </div>` : ''}
        ${meta.competitors_researched != null ? `
        <div class="stat-card">
          <div class="stat-label">Competitors Researched</div>
          <div class="stat-value">${meta.competitors_researched}</div>
        </div>` : ''}
        ${meta.ideation_ideas_incorporated != null ? `
        <div class="stat-card">
          <div class="stat-label">Ideas Incorporated</div>
          <div class="stat-value">${meta.ideation_ideas_incorporated}</div>
        </div>` : ''}
      </div>
      <div style="text-align:center;padding-top:20px;font-size:0.72rem;color:var(--text-tertiary)">
        Generated ${esc(formatDate(meta.created_at))}${meta.updated_at && meta.updated_at !== meta.created_at ? ' &middot; Updated ' + esc(formatDate(meta.updated_at)) : ''}
      </div>
    </footer>`;
  }

  // ── Event Binding ────────────────────────────────────────────
  function bindEvents() {
    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) themeBtn.addEventListener('click', function() { toggleTheme(); });

    // Filter buttons (complexity, impact, source, status, phase)
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const filterName = this.getAttribute('data-filter');
        const value = this.getAttribute('data-value');
        state.filters[filterName] = value;
        // Sync priority pill state if priority filter was changed via button group
        if (filterName === 'priority') syncPriorityPillStates();
        render();
      });
    });

    // Search input
    const searchInput = document.getElementById('filter-search');
    if (searchInput) {
      let debounce;
      searchInput.addEventListener('input', function() {
        clearTimeout(debounce);
        const val = this.value;
        debounce = setTimeout(function() {
          state.filters.search = val;
          render();
          const newInput = document.getElementById('filter-search');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(val.length, val.length);
          }
        }, 250);
      });
    }

    // Clear individual filter tags
    document.querySelectorAll('[data-clear-filter]').forEach(btn => {
      btn.addEventListener('click', function() {
        const key = this.getAttribute('data-clear-filter');
        if (key === 'search') {
          state.filters.search = '';
        } else {
          state.filters[key] = 'all';
        }
        syncPriorityPillStates();
        render();
      });
    });

    // Clear all filters
    const clearAll = document.getElementById('clear-all-filters');
    if (clearAll) {
      clearAll.addEventListener('click', function() {
        state.filters = { priority: 'all', complexity: 'all', impact: 'all', source: 'all', phase: 'all', status: 'all', search: '' };
        syncPriorityPillStates();
        render();
      });
    }

    // Feature card expand/collapse (don't toggle if clicking a link or button inside)
    document.querySelectorAll('.feature-card').forEach(card => {
      card.addEventListener('click', function(e) {
        if (e.target.closest('a') || e.target.closest('button')) return;
        const id = this.getAttribute('data-feature-id');
        if (state.expandedCards.has(id)) {
          state.expandedCards.delete(id);
        } else {
          state.expandedCards.add(id);
        }
        render();
      });
    });

    // Dependency badge click: scroll to and highlight target feature
    document.querySelectorAll('.dep-badge').forEach(badge => {
      badge.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const targetId = this.getAttribute('data-dep-target');
        scrollToFeature(targetId);
      });
    });

    // Timeline phase click: filter by phase (toggle)
    document.querySelectorAll('.timeline-phase').forEach(el => {
      el.addEventListener('click', function() {
        const phaseId = this.getAttribute('data-phase-id');
        state.filters.phase = state.filters.phase === phaseId ? 'all' : phaseId;
        render();
      });
    });

    // Competitive analysis collapsible toggle
    const compToggle = document.getElementById('comp-toggle');
    if (compToggle) {
      compToggle.addEventListener('click', function() {
        this.classList.toggle('open');
        const body = document.getElementById('comp-body');
        if (body) body.classList.toggle('open');
      });
    }
  }

  // Scroll to a feature card, expanding it and highlighting briefly
  function scrollToFeature(featureId) {
    const feature = featureMap[featureId];
    if (!feature) return;

    // If the feature's phase is filtered out, clear the phase filter first
    if (state.filters.phase !== 'all' && feature.phase_id !== state.filters.phase) {
      state.filters.phase = 'all';
      state.expandedCards.add(featureId);
      render();
    }

    if (!state.expandedCards.has(featureId)) {
      state.expandedCards.add(featureId);
      render();
    }

    const card = document.querySelector(`.feature-card[data-feature-id="${featureId}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('highlight');
      setTimeout(function() { card.classList.remove('highlight'); }, 2000);
    }
  }

  // ── Notes ────────────────────────────────────────────────────
  // Notes are stored in localStorage so they survive page reloads.
  // The key includes the report ID so multiple reports don't share notes.
  // When the JSON already has a user_note (previously synced), localStorage copy is dropped.
  const NOTES_STORAGE_KEY = 'roadmap-notes-' + (data.id || 'default');
  let currentNoteId = null;

  function initNotes() {
    try {
      const saved = JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY) || '{}');
      (data.features || []).forEach(feature => {
        // Apply localStorage note only when JSON doesn't already have one
        if (saved[feature.id] && !feature.user_note) {
          feature.user_note = saved[feature.id];
        }
      });
      // Compact: keep only notes that aren't already in the JSON
      const stillNeeded = {};
      Object.entries(saved).forEach(([id, note]) => {
        const feature = (data.features || []).find(f => f.id === id);
        if (feature && feature.user_note !== note) stillNeeded[id] = note;
      });
      if (Object.keys(stillNeeded).length > 0) {
        localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(stillNeeded));
      } else {
        localStorage.removeItem(NOTES_STORAGE_KEY);
      }
    } catch {}
  }

  function openNoteModal(id) {
    currentNoteId = id;
    const feature = (data.features || []).find(f => f.id === id);
    if (!feature) return;

    // Create overlay on first use — reuse across calls
    let overlay = document.getElementById('note-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'note-overlay';
      overlay.className = 'note-overlay';
      overlay.innerHTML = `
        <div class="note-modal">
          <h3 id="note-modal-title"></h3>
          <div class="note-subtitle" id="note-modal-subtitle"></div>
          <textarea id="note-textarea" placeholder="Add context, notes, or amendments for Claude..."></textarea>
          <div class="note-modal-actions">
            <button class="btn-delete-note" id="note-delete-btn" onclick="deleteNoteGlobal()">Delete</button>
            <button class="btn-cancel" onclick="closeNoteModalGlobal()">Cancel</button>
            <button class="btn-save-note" onclick="saveNoteGlobal()">Save Note</button>
          </div>
        </div>
      `;
      // Close modal when clicking the backdrop (outside .note-modal)
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeNoteModal();
      });
      document.body.appendChild(overlay);
    }

    document.getElementById('note-modal-title').textContent = feature.title;
    document.getElementById('note-modal-subtitle').textContent = `${feature.id} · ${feature.priority} priority`;
    document.getElementById('note-textarea').value = feature.user_note || '';
    document.getElementById('note-delete-btn').style.display = feature.user_note ? 'block' : 'none';

    requestAnimationFrame(function() {
      overlay.classList.add('open');
      document.getElementById('note-textarea').focus();
    });
  }

  function closeNoteModal() {
    const overlay = document.getElementById('note-overlay');
    if (overlay) overlay.classList.remove('open');
    currentNoteId = null;
  }

  function saveNote() {
    if (!currentNoteId) return;
    const feature = (data.features || []).find(f => f.id === currentNoteId);
    if (!feature) return;
    const text = document.getElementById('note-textarea').value.trim();
    feature.user_note = text || undefined;
    persistNotes();
    closeNoteModal();
    render();
    showToast(text ? 'Note saved' : 'Note removed');
  }

  function deleteNote() {
    if (!currentNoteId) return;
    const feature = (data.features || []).find(f => f.id === currentNoteId);
    if (!feature) return;
    delete feature.user_note;
    persistNotes();
    closeNoteModal();
    render();
    showToast('Note removed');
  }

  function persistNotes() {
    const notes = {};
    (data.features || []).forEach(f => {
      if (f.user_note) notes[f.id] = f.user_note;
    });
    if (Object.keys(notes).length > 0) {
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notes));
      hasUnsavedChanges = true;
    } else {
      localStorage.removeItem(NOTES_STORAGE_KEY);
    }
    updateSyncButton();
  }

  // Close note modal on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNoteModal();
  });

  // Expose functions that are called from inline onclick attributes (IIFE scope workaround)
  window.setFeatureStatusGlobal = setFeatureStatus;
  window.copyClaudePromptGlobal = copyClaudePrompt;
  window.togglePriorityPillGlobal = togglePriorityPill;
  window.openNoteModalGlobal = openNoteModal;
  window.closeNoteModalGlobal = closeNoteModal;
  window.saveNoteGlobal = saveNote;
  window.deleteNoteGlobal = deleteNote;

  // ── Initial Render ───────────────────────────────────────────
  // Apply saved status overrides and notes before rendering so cards show correct state on load
  initStatusOverrides();
  initNotes();
  render();

})();
</script>
</body>
</html>
